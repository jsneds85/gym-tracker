// Storage
var db = {};
try { db = JSON.parse(localStorage.getItem(‘gt3’) || ‘{}’); } catch(e) { db = {}; }
var saveTimer = null;
var saving = false;

function persist() {
saving = true;
clearTimeout(saveTimer);
saveTimer = setTimeout(function() {
try { localStorage.setItem(‘gt3’, JSON.stringify(db)); } catch(e) {}
saving = false;
var el = document.getElementById(‘sv’);
if (el) el.innerHTML = ‘saved checkmark’;
}, 700);
}

function getE(w, did, eid) {
if (!db[w]) db[w] = {};
if (!db[w][did]) db[w][did] = {};
if (!db[w][did][eid]) db[w][did][eid] = {};
return db[w][did][eid];
}

function setE(w, did, eid, key, val) {
getE(w, did, eid)[key] = val;
persist();
}

function getSug(week, did, eid) {
if (week === 0) return ‘’;
var prev = getE(week - 1, did, eid);
if (!prev.wt) return ‘’;
var n = parseFloat(prev.wt);
if (isNaN(n)) return ‘’;
if (prev.feel === ‘easy’) return ‘’ + (n + 5);
if (prev.feel === ‘hard’) return ‘’ + (Math.max(5, n - 5));
return prev.wt;
}

// State

var day = 0;
var noteEx = null;
var noteVal = ‘’;

function render() {

if (getE(week, d.id, d.exercises[i].id).done) doneCt++;

html += ‘<div id="sv" style="font-size:10px;font-family:DM Mono,monospace;color:#333;">’ + (saving ? ‘saving…’ : ‘saved’) + ‘</div>’;
html += ‘</div>’;
html += ‘</div>’;

// Day tabs
html += ‘<div style="display:flex;overflow-x:auto;gap:6px;padding-bottom:14px;">’;
for (var ti = 0; ti < DAYS.length; ti++) {
var td = DAYS[ti];
var ta = day === ti;
html += ‘<button onclick="selDay(' + ti + ')" style="background:' + (ta ? td.color : '#131313') + ';color:' + (ta ? '#000' : '#555') + ';border-radius:7px;padding:7px 14px;font-size:11px;font-weight:600;font-family:DM Mono,monospace;white-space:nowrap;border:none;">’ + td.label + ‘</button>’;
}
html += ‘</div>’;
html += ‘</div>’; // end header

// — WEEK BAR —
html += ‘<div style="padding:12px 20px;border-bottom:1px solid #111;">’;
html += ‘<div style="font-size:9px;color:#333;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:9px;">Week</div>’;
html += ‘<div style="display:flex;overflow-x:auto;gap:5px;">’;
for (var wi = 0; wi < 12; wi++) {
var ws = week === wi;
var wh = false;
for (var wdi = 0; wdi < DAYS.length; wdi++) {
for (var wei = 0; wei < DAYS[wdi].exercises.length; wei++) {
var we = getE(wi, DAYS[wdi].id, DAYS[wdi].exercises[wei].id);
if (we.wt || we.done) { wh = true; break; }
}
if (wh) break;
}
html += ‘<button onclick="selWeek(' + wi + ')" style="position:relative;background:' + (ws ? '#fff' : '#111') + ';color:' + (ws ? '#000' : wh ? '#777' : '#333') + ';border:1px solid ' + (ws ? '#fff' : wh ? '#2a2a2a' : '#1a1a1a') + ';border-radius:5px;padding:4px 10px;font-size:10px;font-family:DM Mono,monospace;font-weight:' + (ws ? 700 : wh ? 500 : 400) + ';">W’ + (wi+1) + (wh && !ws ? ‘<span style="position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:' + c + ';display:block;"></span>’ : ‘’) + ‘</button>’;
}
html += ‘</div></div>’;

// Progress bar
html += ‘<div style="height:2px;background:#111;"><div style="height:100%;width:' + pct + '%;background:' + c + ';border-radius:0 1px 1px 0;transition:width 0.4s;"></div></div>’;

// — LIST —
html += ‘<div style="padding-bottom:90px;">’;

// Warmup
html += ‘<div style="padding:12px 20px 4px;border-bottom:1px solid #111;">’;

html += ‘<button onclick="togWu(\'' + wu.id + '\')" style="width:22px;height:22px;border-radius:50%;border:2px solid ' + (wd ? c : '#222') + ';background:' + (wd ? c : 'transparent') + ';color:' + (wd ? '#000' : 'transparent') + ';font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">✓</button>’;
html += ‘<span style="font-size:12px;color:' + (wd ? '#444' : '#aaa') + ';text-decoration:' + (wd ? 'line-through' : 'none') + ';">’ + wu.name + ‘</span>’;
html += ‘</div>’;
html += ‘<span style="font-size:10px;font-family:DM Mono,monospace;color:#333;">’ + wu.sets + ‘x’ + wu.reps + ‘</span>’;
html += ‘</div>’;
}
html += ‘<div style="height:4px;"></div></div>’;

// Column headers
html += ‘<div style="display:grid;grid-template-columns:1fr 60px 62px 58px 28px;gap:6px;padding:12px 20px 8px;border-bottom:1px solid #0f0f0f;">’;
html += ‘<div style="font-size:9px;color:#2a2a2a;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:0.1em;"><span style="color:' + c + ';">►</span> Main Work</div>’;
var hdrs = [‘Sets x Reps’, ‘Target’, ‘Actual’, ‘’];
for (var hi = 0; hi < hdrs.length; hi++) {
html += ‘<div style="font-size:9px;color:#2a2a2a;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:0.1em;text-align:center;">’ + hdrs[hi] + ‘</div>’;
}
html += ‘</div>’;

// Exercises
for (var ei = 0; ei < d.exercises.length; ei++) {
var ex = d.exercises[ei];
var ent = getE(week, d.id, ex.id);

var tgtC = (sug && !ex.bw) ? c : ‘#333’;
var tgtW = (sug && !ex.bw) ? ‘700’ : ‘400’;
var editing = noteEx === ex.id;
var bg = done ? ‘#0d110a’ : ‘transparent’;

html += ‘<div style="position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #141414;padding:11px 20px;display:flex;justify-content:space-between;align-items:center;">’;

}

function selDay(i) { day = i; noteEx = null; render(); }
function selWeek(i) { week = i; noteEx = null; render(); }

function togWu(eid) {
var e = getE(week, DAYS[day].id, eid);
setE(week, DAYS[day].id, eid, ‘done’, !e.done);
render();
}

function togDone(eid) {
var e = getE(week, DAYS[day].id, eid);
setE(week, DAYS[day].id, eid, ‘done’, !e.done);
render();
}

function setFeel(eid, f) {
var e = getE(week, DAYS[day].id, eid);
setE(week, DAYS[day].id, eid, ‘feel’, e.feel === f ? ‘’ : f);
render();
}

function setWt(eid, val) {
setE(week, DAYS[day].id, eid, ‘wt’, val);
}

function clearNote(eid) {
setE(week, DAYS[day].id, eid, ‘note’, ‘’);
render();
}

function startNote(eid) {
var e = getE(week, DAYS[day].id, eid);
noteEx = eid;
noteVal = e.note || ‘’;
render();
}

function saveNote(eid) {
setE(week, DAYS[day].id, eid, ‘note’, noteVal);
noteEx = null;
noteVal = ‘’;
render();
}

function cancelNote() {
noteEx = null;
noteVal = ‘’;
render();
}

function noteKey(e, eid) {
if (e.key === ‘Enter’) saveNote(eid);
if (e.key === ‘Escape’) cancelNote();
}

render();
